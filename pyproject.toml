[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "adv_mla_lab_8"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab==4.6.1",
    "loguru",
    "mkdocs",
    "mykrml-ninzzz>=0.0.8",
    "numpy>=2.5.4",
    "pandas==2.2.2",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn==1.6.1",
    "tqdm",
    "typer",
    "wandb==0.28.0",
]
requires-python = ">=3.12.11, <3.13"


[tool.ruff]
line-length = 99
src = ["adv_mla_lab_8"]
include = ["pyproject.toml", "adv_mla_lab_8/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["adv_mla_lab_8"]
force-sort-within-sections = true

